modLoader = "kotlinforforge"
loaderVersion = "[5.12,)"
issueTrackerURL = "https://github.com/Laxystem/Laxombat/issues"
license = "MPL-2.0"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "Laxystem"
description = '''
Community rendition of a ninth combat snapshot
'''
#logoFile = ""

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[26.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "architectury"
type = "required"
versionRange = "[${architectury},)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "laxombat.mixins.json"
